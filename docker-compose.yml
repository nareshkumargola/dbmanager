version: "3.9"

services:
  backend:
    container_name: dbmanager-api
    image: ashish2429/dbmanager-backend:1.0
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - dbmanager-network

  frontend:
    container_name: dbmanager-frontend
    image: ashish2429/dbmanagerfrontend:1.0
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - dbmanager-network

networks:
  dbmanager-network:
    driver: bridge
